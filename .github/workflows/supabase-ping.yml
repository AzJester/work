name: Supabase keep-alive

# Free Supabase projects pause after ~7 days of inactivity. This hits the
# project's REST API once a day so the database stays warm. It uses only the
# public *publishable* key (the same one already shipped in the client HTML),
# so there is no secret to configure. Row Level Security still protects data —
# the request just needs to reach Postgres to count as activity.

on:
  schedule:
    - cron: "23 6 * * *"   # daily at 06:23 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: supabase-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://hqqwlkmggwgaoiyzgrhy.supabase.co"
          KEY="sb_publishable_HmSmGVio0b9HQCBocjeuYA_eleacS3u"
          # Call the public read-only share RPC with a token that cannot match.
          # The function still performs a database lookup, but returns null and
          # exposes no user data. Opaque sb_publishable keys belong only in the
          # apikey header; sending one as a Bearer token is rejected as invalid JWT.
          code=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 \
            -X POST \
            -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            --data '{"p_token":"00000000-0000-0000-0000-000000000000"}' \
            "$URL/rest/v1/rpc/secure_shared_dashboard" || echo "000")
          echo "secure shared-dashboard lookup -> HTTP $code"

          # A network response alone is not enough: paused projects (HTTP 540),
          # bad keys, and missing routes must fail the workflow instead of
          # producing a false keep-alive success.
          case "$code" in
            2??) ;;
            *)
              echo "::error::Supabase did not return a successful database response (query=$code)"
              exit 1
              ;;
          esac

          echo "Supabase responded — activity registered, project stays warm."
