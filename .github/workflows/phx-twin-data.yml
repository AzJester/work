name: PHX twin data

# Jobs that need the open internet on behalf of the PHX digital twin:
#   feeds     - reports what the public ADS-B APIs return for KPHX (changes nothing)
#   imagery   - bakes public-domain NAIP aerial photography into phx-digital-twin/data
#               and commits it back to the branch
#   deployed  - checks the public page and the live ADS-B relay after a deploy
#   record    - records a few minutes of the live relay for offline replay (demo capture)
# On a pull request, feeds and imagery run when the fetch scripts change. Run it by hand
# (Actions > PHX twin data > Run workflow) to check the deployment or to re-bake imagery.
on:
  pull_request:
    paths:
      - phx-digital-twin/tools/fetch_imagery.py
      - phx-digital-twin/tools/imagery.config.json
      - phx-digital-twin/tools/probe_feeds.mjs
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        default: check-deployment
        options:
          - check-deployment
          - bake-imagery
          - record-feed

permissions:
  contents: write

concurrency:
  group: phx-twin-data-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe ADS-B sources
        run: node phx-digital-twin/tools/probe_feeds.mjs

  imagery:
    if: github.event_name == 'pull_request' || inputs.task == 'bake-imagery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install imaging libraries
        run: pip install --quiet numpy pillow requests pyproj opencv-python-headless
      - name: Fetch and bake aerial imagery
        env:
          # a manual run always re-bakes; a pull-request run skips when the committed bake matches the script
          FORCE_BAKE: ${{ inputs.task == 'bake-imagery' && '1' || '0' }}
        run: python phx-digital-twin/tools/fetch_imagery.py
      - name: Commit baked imagery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A phx-digital-twin/data phx-digital-twin/tools/imagery_report.json
          if git diff --cached --quiet; then
            echo "No imagery changes."
          else
            git commit -m "PHX twin: bake NAIP aerial imagery (fetched by CI)"
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

  deployed:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'check-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the public page and the live relay
        run: node phx-digital-twin/tools/check_deployment.mjs

  record:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'record-feed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record the live relay
        run: node phx-digital-twin/tools/record_feed.mjs
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phx-digital-twin/tools/_recording/feed.json.gz
          git commit -m "PHX twin: recorded live ADS-B feed for demo capture"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
